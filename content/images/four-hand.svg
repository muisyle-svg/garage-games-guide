<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">A competitor makes four forehand disc golf throws into a basket, stepping back a line after each one</title>
<style>
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}
.stride,.stride2{animation:stride .6s ease-in-out infinite alternate;transform-origin:-2px 245px}
.stride2{animation-delay:-.6s}
@keyframes stride{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.label{font:700 13px system-ui,sans-serif;fill:#f3efe6}
.walk{animation-name:walk;animation-timing-function:ease-in-out;}@keyframes walk{0%{transform:translate(230px,0px)}19%{transform:translate(230px,0px)}23%{transform:translate(190px,0px)}44%{transform:translate(190px,0px)}48%{transform:translate(150px,0px)}69%{transform:translate(150px,0px)}73%{transform:translate(110px,0px)}94%{transform:translate(110px,0px)}96%{transform:translate(110px,0px)}100%{transform:translate(230px,0px)}}.arm{animation-name:arm;animation-timing-function:ease-in-out;transform-origin:2px 150px;}@keyframes arm{0%{transform:rotate(75deg)}3%{transform:rotate(75deg)}8%{transform:rotate(165deg)}11%{transform:rotate(-5deg)}14%{transform:rotate(-15deg)}19%{transform:rotate(75deg)}25%{transform:rotate(75deg)}28%{transform:rotate(75deg)}33%{transform:rotate(165deg)}36%{transform:rotate(-5deg)}39%{transform:rotate(-15deg)}44%{transform:rotate(75deg)}50%{transform:rotate(75deg)}53%{transform:rotate(75deg)}58%{transform:rotate(165deg)}61%{transform:rotate(-5deg)}64%{transform:rotate(-15deg)}69%{transform:rotate(75deg)}75%{transform:rotate(75deg)}78%{transform:rotate(75deg)}83%{transform:rotate(165deg)}86%{transform:rotate(-5deg)}89%{transform:rotate(-15deg)}94%{transform:rotate(75deg)}}.held{animation-name:held;animation-timing-function:steps(1,end);}@keyframes held{0%{opacity:0}0%{opacity:1}11%{opacity:0}25%{opacity:1}36%{opacity:0}50%{opacity:1}61%{opacity:0}75%{opacity:1}86%{opacity:0}100%{opacity:0}}.disc0{animation-name:disc0;animation-timing-function:linear;}@keyframes disc0{0%{transform:translate(284px,148px)}11%{transform:translate(284px,148px)}14.5%{transform:translate(402px,104px)}18%{transform:translate(520px,214px)}100%{transform:translate(520px,214px)}}.discv0{animation-name:discv0;animation-timing-function:steps(1,end);}@keyframes discv0{0%{opacity:0}11%{opacity:1}97%{opacity:0}100%{opacity:0}}.disc1{animation-name:disc1;animation-timing-function:linear;}@keyframes disc1{0%{transform:translate(244px,148px)}36%{transform:translate(244px,148px)}39.5%{transform:translate(382px,104px)}43%{transform:translate(520px,210px)}100%{transform:translate(520px,210px)}}.discv1{animation-name:discv1;animation-timing-function:steps(1,end);}@keyframes discv1{0%{opacity:0}36%{opacity:1}97%{opacity:0}100%{opacity:0}}.disc2{animation-name:disc2;animation-timing-function:linear;}@keyframes disc2{0%{transform:translate(204px,148px)}61%{transform:translate(204px,148px)}64.5%{transform:translate(362px,104px)}68%{transform:translate(520px,206px)}100%{transform:translate(520px,206px)}}.discv2{animation-name:discv2;animation-timing-function:steps(1,end);}@keyframes discv2{0%{opacity:0}61%{opacity:1}97%{opacity:0}100%{opacity:0}}.disc3{animation-name:disc3;animation-timing-function:linear;}@keyframes disc3{0%{transform:translate(164px,148px)}86%{transform:translate(164px,148px)}89.5%{transform:translate(342px,104px)}93%{transform:translate(520px,202px)}100%{transform:translate(520px,202px)}}.discv3{animation-name:discv3;animation-timing-function:steps(1,end);}@keyframes discv3{0%{opacity:0}86%{opacity:1}97%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
