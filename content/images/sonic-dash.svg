<g class="a ptsv2" opacity="0"><text class="a pts2" x="410" y="182" text-anchor="middle" style="font:800 18px system-ui,sans-serif;fill:#f2b705">+5</text></g><rect x="536" y="128" width="68" height="34" rx="4" fill="#a8743f"/><circle cx="546" cy="124" r="4" fill="#6c737d"/><circle cx="594" cy="124" r="4" fill="#6c737d"/>
