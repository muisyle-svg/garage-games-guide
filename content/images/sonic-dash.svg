<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">A competitor runs to whichever wall button is blinking and presses it, and the next button starts blinking</title>
<style>
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}
.stride,.stride2{animation:stride .6s ease-in-out infinite alternate;transform-origin:-2px 245px}
.stride2{animation-delay:-.6s}
@keyframes stride{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.label{font:700 13px system-ui,sans-serif;fill:#f3efe6}
.run{animation-name:run;animation-timing-function:ease-in-out;}@keyframes run{0%{transform:translate(320px,0px)}2%{transform:translate(320px,0px)}12%{transform:translate(386px,0px)}27%{transform:translate(386px,0px)}37%{transform:translate(114px,0px)}52%{transform:translate(114px,0px)}62%{transform:translate(546px,0px)}77%{transform:translate(546px,0px)}87%{transform:translate(274px,0px)}100%{transform:translate(320px,0px)}}.face{animation-name:face;animation-timing-function:steps(1,end);}@keyframes face{0%{transform:scaleX(1)}25%{transform:scaleX(-1)}50%{transform:scaleX(1)}75%{transform:scaleX(-1)}100%{transform:scaleX(-1)}}.arm{animation-name:arm;animation-timing-function:ease-in-out;transform-origin:2px 150px;}@keyframes arm{0%{transform:rotate(85deg)}12%{transform:rotate(85deg)}15%{transform:rotate(60deg)}19%{transform:rotate(85deg)}37%{transform:rotate(85deg)}40%{transform:rotate(60deg)}44%{transform:rotate(85deg)}62%{transform:rotate(85deg)}65%{transform:rotate(60deg)}69%{transform:rotate(85deg)}87%{transform:rotate(85deg)}90%{transform:rotate(60deg)}94%{transform:rotate(85deg)}}.red0{animation-name:red0;animation-timing-function:steps(1,end);}@keyframes red0{0%{opacity:0}25%{opacity:1}26.5%{opacity:0}28%{opacity:1}29.5%{opacity:0}31%{opacity:1}32.5%{opacity:0}34%{opacity:1}35.5%{opacity:0}37%{opacity:1}38.5%{opacity:0}100%{opacity:0}}.grn0{animation-name:grn0;animation-timing-function:steps(1,end);}@keyframes grn0{0%{opacity:0}40%{opacity:1}47%{opacity:0}100%{opacity:0}}.pts0{animation-name:pts0;animation-timing-function:linear;}@keyframes pts0{0%{transform:translate(0px,0px)}40%{transform:translate(0px,0px)}48%{transform:translate(0px,-30px)}48.01%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.ptsv0{animation-name:ptsv0;animation-timing-function:steps(1,end);}@keyframes ptsv0{0%{opacity:0}40%{opacity:1}48%{opacity:0}100%{opacity:0}}.red1{animation-name:red1;animation-timing-function:steps(1,end);}@keyframes red1{0%{opacity:0}75%{opacity:1}76.5%{opacity:0}78%{opacity:1}79.5%{opacity:0}81%{opacity:1}82.5%{opacity:0}84%{opacity:1}85.5%{opacity:0}87%{opacity:1}88.5%{opacity:0}100%{opacity:0}}.grn1{animation-name:grn1;animation-timing-function:steps(1,end);}@keyframes grn1{0%{opacity:0}90%{opacity:1}97%{opacity:0}100%{opacity:0}}.pts1{animation-name:pts1;animation-timing-function:linear;}@keyframes pts1{0%{transform:translate(0px,0px)}90%{transform:translate(0px,0px)}98%{transform:translate(0px,-30px)}98.01%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.ptsv1{animation-name:ptsv1;animation-timing-function:steps(1,end);}@keyframes ptsv1{0%{opacity:0}90%{opacity:1}98%{opacity:0}100%{opacity:0}}.red2{animation-name:red2;animation-timing-function:steps(1,end);}@keyframes red2{0%{opacity:0}0%{opacity:1}1.5%{opacity:0}3%{opacity:1}4.5%{opacity:0}6%{opacity:1}7.5%{opacity:0}9%{opacity:1}10.5%{opacity:0}12%{opacity:1}13.5%{opacity:0}100%{opacity:0}}.grn2{animation-name:grn2;animation-timing-function:steps(1,end);}@keyframes grn2{0%{opacity:0}15%{opacity:1}22%{opacity:0}100%{opacity:0}}.pts2{animation-name:pts2;animation-timing-function:linear;}@keyframes pts2{0%{transform:translate(0px,0px)}15%{transform:translate(0px,0px)}23%{transform:translate(0px,-30px)}23.01%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.ptsv2{animation-name:ptsv2;animation-timing-function:steps(1,end);}@keyframes ptsv2{0%{opacity:0}15%{opacity:1}23%{opacity:0}100%{opacity:0}}.red3{animation-name:red3;animation-timing-function:steps(1,end);}@keyframes red3{0%{opacity:0}50%{opacity:1}51.5%{opacity:0}53%{opacity:1}54.5%{opacity:0}56%{opacity:1}57.5%{opacity:0}59%{opacity:1}60.5%{opacity:0}62%{opacity:1}63.5%{opacity:0}100%{opacity:0}}.grn3{animation-name:grn3;animation-timing-function:steps(1,end);}@keyframes grn3{0%{opacity:0}65%{opacity:1}72%{opacity:0}100%{opacity:0}}.pts3{animation-name:pts3;animation-timing-function:linear;}@keyframes pts3{0%{transform:translate(0px,0px)}65%{transform:translate(0px,0px)}73%{transform:translate(0px,-30px)}73.01%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}.ptsv3{animation-name:ptsv3;animation-timing-function:steps(1,end);}@keyframes ptsv3{0%{opacity:0}65%{opacity:1}73%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
