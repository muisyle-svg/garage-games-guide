<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">A competitor throws a dart at a dartboard mounted on the sliding seat of a rowing machine as it rolls left to right</title>
<style>
.a{animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:linear}
.stride,.stride2{animation:stride .6s ease-in-out infinite alternate;transform-origin:-2px 245px}
.stride2{animation-delay:-.6s}
@keyframes stride{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.label{font:700 13px system-ui,sans-serif;fill:#f3efe6}
.seat{animation-name:seat;animation-timing-function:linear;}@keyframes seat{0%{transform:translate(0px,0px)}50%{transform:translate(240px,0px)}80%{transform:translate(240px,0px)}100%{transform:translate(0px,0px)}}.arm{animation-name:arm;animation-timing-function:ease-in-out;transform-origin:72px 150px;}@keyframes arm{0%{transform:rotate(-20deg)}18%{transform:rotate(-150deg)}25%{transform:rotate(-15deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-20deg)}100%{transform:rotate(-20deg)}}.held{animation-name:held;animation-timing-function:steps(1,end);}@keyframes held{0%{opacity:0}0%{opacity:1}25%{opacity:0}100%{opacity:0}}.dart{animation-name:dart;animation-timing-function:linear;}@keyframes dart{0%{transform:translate(122px,135px) rotate(-22deg)}25%{transform:translate(122px,135px) rotate(-22deg)}28.75%{transform:translate(189.5px,95px) rotate(-12deg)}32.5%{transform:translate(257px,82.5px) rotate(0deg)}36.25%{transform:translate(324.5px,97.5px) rotate(12deg)}40%{transform:translate(392px,140px) rotate(15deg)}50%{transform:translate(440px,140px) rotate(15deg)}80%{transform:translate(440px,140px) rotate(15deg)}100%{transform:translate(200px,140px) rotate(15deg)}}.dartv{animation-name:dartv;animation-timing-function:steps(1,end);}@keyframes dartv{0%{opacity:0}25%{opacity:1}94%{opacity:0}100%{opacity:0}}.whoosh{animation-name:whoosh;animation-timing-function:steps(1,end);}@keyframes whoosh{0%{opacity:0}29%{opacity:0.5}37%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="#1f1d19"/><rect width="12" height="24" fill="#f2b705"/></pattern>
<symbol id="dart" overflow="visible"><path d="M0 0 L-9 -2 L-9 2 Z" fill="#c9ccd1"/><rect x="-26" y="-2.5" width="17" height="5" rx="2" fill="#5a6270"/><rect x="-36" y="-1.5" width="10" height="3" fill="#8a929e"/><path d="M-34 0 L-46 -9 L-50 -9 L-42 0 L-50 9 L-46 9 Z" fill="#e2532d"/></symbol>
</defs>
<rect width="640" height="400" fill="#2b2925"/>
<g fill="#34312c"><rect y="40" width="640" height="2"/><rect y="110" width="640" height="2"/><rect y="180" width="640" height="2"/><rect y="250" width="640" height="2"/></g>
<rect y="340" width="640" height="60" fill="#3a362f"/>

<rect y="336" width="640" height="8" fill="url(#hazard)"/>
<rect x="18" y="340" width="120" height="14" rx="3" fill="#6b3a2e"/>
<rect x="140" y="296" width="420" height="9" rx="4" fill="#9aa1ab"/>
<rect x="146" y="300" width="10" height="38" rx="3" fill="#6c737d"/><rect x="128" y="332" width="46" height="8" rx="4" fill="#6c737d"/>
<rect x="466" y="284" width="8" height="14" rx="2" fill="#c0392b"/>
<path d="M522 296 L536 254 L550 258 L540 298 Z" fill="#4c525a"/>
<circle cx="588" cy="282" r="40" fill="#1f1d19" stroke="#4c525a" stroke-width="6"/><circle cx="588" cy="282" r="12" fill="#4c525a"/>
<rect x="566" y="318" width="44" height="22" rx="4" fill="#4c525a"/>
<path d="M588 244 L566 190" stroke="#6c737d" stroke-width="6" stroke-linecap="round"/>
<rect x="548" y="168" width="34" height="26" rx="4" fill="#1f1d19" stroke="#6c737d" stroke-width="3"/><rect x="553" y="173" width="24" height="16" rx="2" fill="#3f8f6a"/>
<g class="a seat">
<circle cx="186" cy="294" r="5" fill="#1f1d19"/><circle cx="214" cy="294" r="5" fill="#1f1d19"/>
<rect x="176" y="278" width="48" height="13" rx="6" fill="#d8d2c4"/><rect x="196" y="203" width="8" height="77" fill="#8a929e"/>
<g transform="translate(200 145)"><circle r="58" fill="#1f1d19"/><circle r="46" fill="#f3e7c9"/><circle r="38" fill="#c0392b"/><circle r="30" fill="#f3e7c9"/><circle r="21" fill="#2e9d5f"/><circle r="13" fill="#f3e7c9"/><circle r="6" fill="#c0392b"/>
<path d="M-46 0 H46 M0 -46 V46 M-32.5 -32.5 L32.5 32.5 M-32.5 32.5 L32.5 -32.5" stroke="#1f1d19" stroke-width="1.5" opacity=".55"/></g>
</g>
<path class="a whoosh" d="M130 128 Q 260 60 380 128" fill="none" stroke="#f3efe6" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round" opacity="0"/>
<g transform="translate(70 0)"><g stroke="#f2b705" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M0 160 L-2 245"/><path d="M-2 245 L-18 290 L-24 336"/><path d="M-2 245 L20 288 L26 336"/><path d="M0 168 L-18 200 L-30 228"/>
</g>
<circle cx="2" cy="128" r="20" fill="#f2b705"/>
<path d="M14 120 h8" stroke="#1f1d19" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="a arm"><path d="M72 150 H122" stroke="#f2b705" stroke-width="10" stroke-linecap="round"/><use href="#dart" class="a held" transform="translate(134 150)"/></g>
<g class="a dartv"><g class="a dart"><use href="#dart"/></g></g>
</svg>
