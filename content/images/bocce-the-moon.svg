<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">Shoot the Moon: a competitor at the raised near end of a wooden board spreads two steel rods so a ball rolls up from the far low end toward them, then drops it into the 100 hole</title>
<style>
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}
.stride,.stride2{animation:stride .6s ease-in-out infinite alternate;transform-origin:-2px 245px}
.stride2{animation-delay:-.6s}
@keyframes stride{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.label{font:700 13px system-ui,sans-serif;fill:#f3efe6}
.lrod{animation-name:lrod;animation-timing-function:ease-in-out;transform-origin:316px 60px;}@keyframes lrod{0%{transform:rotate(0deg)}6%{transform:rotate(0deg)}12%{transform:rotate(3deg)}17%{transform:rotate(0deg)}22%{transform:rotate(0deg)}28%{transform:rotate(3deg)}33%{transform:rotate(0deg)}38%{transform:rotate(0deg)}44%{transform:rotate(3deg)}49%{transform:rotate(0deg)}54%{transform:rotate(0deg)}60%{transform:rotate(3deg)}65%{transform:rotate(0deg)}70%{transform:rotate(0deg)}74%{transform:rotate(6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}.rrod{animation-name:rrod;animation-timing-function:ease-in-out;transform-origin:324px 60px;}@keyframes rrod{0%{transform:rotate(0deg)}6%{transform:rotate(0deg)}12%{transform:rotate(-3deg)}17%{transform:rotate(0deg)}22%{transform:rotate(0deg)}28%{transform:rotate(-3deg)}33%{transform:rotate(0deg)}38%{transform:rotate(0deg)}44%{transform:rotate(-3deg)}49%{transform:rotate(0deg)}54%{transform:rotate(0deg)}60%{transform:rotate(-3deg)}65%{transform:rotate(0deg)}70%{transform:rotate(0deg)}74%{transform:rotate(-6deg)}90%{transform:rotate(-6deg)}95%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}.ball{animation-name:ball;animation-timing-function:ease-in-out;}@keyframes ball{0%{transform:translate(0px,73.44px) scale(0.528)}6%{transform:translate(0px,73.44px) scale(0.528)}12%{transform:translate(0px,115.92px) scale(0.654)}22%{transform:translate(0px,115.92px) scale(0.654)}28%{transform:translate(0px,163.12px) scale(0.794)}38%{transform:translate(0px,163.12px) scale(0.794)}44%{transform:translate(0px,210.32px) scale(0.934)}54%{transform:translate(0px,210.32px) scale(0.934)}60%{transform:translate(0px,276.4px) scale(1.130)}100%{transform:translate(0px,276.4px) scale(1.130)}}.ball{transform-box:fill-box;transform-origin:center}.drop{animation-name:drop;animation-timing-function:linear;}@keyframes drop{0%{opacity:1}72%{opacity:1}76%{opacity:0}100%{opacity:0}}.glow{animation-name:glow;animation-timing-function:steps(1,end);}@keyframes glow{0%{opacity:0}76%{opacity:1}92%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
