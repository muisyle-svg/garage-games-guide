<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">A competitor balances a paddle upright on one finger while walking through a squat rack and back</title>
<style>
.a{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}
.stride,.stride2{animation:stride .6s ease-in-out infinite alternate;transform-origin:-2px 245px}
.stride2{animation-delay:-.6s}
@keyframes stride{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.label{font:700 13px system-ui,sans-serif;fill:#f3efe6}
.walk{animation-name:walk;animation-timing-function:ease-in-out;}@keyframes walk{0%{transform:translate(150px,0px)}6%{transform:translate(150px,0px)}44%{transform:translate(585px,0px)}50%{transform:translate(585px,0px)}88%{transform:translate(150px,0px)}100%{transform:translate(150px,0px)}}.flip{animation-name:flip;animation-timing-function:steps(1,end);}@keyframes flip{0%{transform:scaleX(1)}47%{transform:scaleX(1)}47.01%{transform:scaleX(-1)}91%{transform:scaleX(-1)}91.01%{transform:scaleX(1)}100%{transform:scaleX(1)}}.wobble{animation:wobble 1.3s ease-in-out infinite alternate;transform-origin:26px 104px}@keyframes wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="#1f1d19"/><rect width="12" height="24" fill="#f2b705"/></pattern>

</defs>
<rect width="640" height="400" fill="#2b2925"/>
<g fill="#34312c"><rect y="40" width="640" height="2"/><rect y="110" width="640" height="2"/><rect y="180" width="640" height="2"/><rect y="250" width="640" height="2"/></g>
<rect y="340" width="640" height="60" fill="#262422"/>
<rect y="340" width="250" height="60" fill="#3f6b3a"/>
<rect y="336" width="640" height="8" fill="url(#hazard)"/>
<rect x="226" y="346" width="5" height="50" fill="#f3efe6" opacity=".85"/>
<g fill="#4c525a"><rect x="400" y="24" width="14" height="314"/><rect x="500" y="24" width="14" height="314"/><rect x="396" y="18" width="122" height="12" rx="3"/>
<rect x="388" y="330" width="38" height="8" rx="3"/><rect x="488" y="330" width="38" height="8" rx="3"/></g>
<g fill="#6c737d"><rect x="414" y="140" width="10" height="8"/><rect x="490" y="140" width="10" height="8"/></g>
<g class="a walk"><g class="a flip"><g stroke="#f2b705" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M0 160 L-2 245"/><g class="stride"><path d="M-2 245 L-6 290 L-4 336"/></g><g class="stride2"><path d="M-2 245 L-6 290 L-4 336"/></g><path d="M0 168 L-18 200 L-30 228"/>
</g>
<circle cx="2" cy="128" r="20" fill="#f2b705"/>
<path d="M14 120 h8" stroke="#1f1d19" stroke-width="3" stroke-linecap="round"/>

<path d="M2 150 L22 132 L26 108" stroke="#f2b705" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="wobble"><path d="M26 104 V20" stroke="#a8743f" stroke-width="6" stroke-linecap="round"/><ellipse cx="26" cy="34" rx="10" ry="24" fill="#a8743f" stroke="#7a5230" stroke-width="2"/></g>
</g></g>
</svg>
