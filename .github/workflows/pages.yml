name: Deploy event guide

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The scorekeeper uploads scores.json to the live-scores branch; that branch's small
  # "Live scores updated" workflow then sets off this one, which runs from main.
  workflow_run:
    workflows: [Live scores updated]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The live scores belong to the current year (current_year in content/settings.md).
      # A year whose scores were saved into content/years/<year>/scores.json keeps those instead.
      - name: Add the live scores
        run: |
          YEAR=$(node build.mjs --live-year)
          if [ -e "dist/$YEAR/scores.json" ]; then
            echo "$YEAR has saved scores; live scores not used."
          elif git fetch --depth=1 origin live-scores && git cat-file -e FETCH_HEAD:scores.json; then
            git show FETCH_HEAD:scores.json > "dist/$YEAR/scores.json"
          else
            echo "No live scores yet."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
